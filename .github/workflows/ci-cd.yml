name: CI/CD - Mind Your Mind

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  # SECURITY
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        run: docker run -v ${{ github.workspace }}:/path ghcr.io/gitleaks/gitleaks:latest detect --source="/path" -v

  # QUALITY
  quality:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Análise com SonarCloud 
        uses: SonarSource/sonarcloud-github-action@v2 
        with: 
          args: > 
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
        env: 
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # BACKEND — Build e Testes
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    needs: security

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build e testes
        run: cd backend && mvn clean verify
        env:
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/mindDB

      - name: Gerar JAR
        # Permite gerar o JAR tanto na main quanto na dev para testes
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        run: cd backend && mvn clean package -DskipTests
        env:
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/mindDB

      - name: Upload JAR como artefato
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

  # FRONTEND — Build
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: cd frontend && npm ci

      - name: Verificar vulnerabilidade
        run: cd frontend && npm audit --audit-level=high || true

      - name: Rodar lint
        run: cd frontend && npm run lint

      # - name: Run Coverage (Descomentar se adicionar testes ao React)
      #   run: cd frontend && npm run test -- --coverage

      - name: Build
        run: cd frontend && npm run build

      - name: Upload build como artefato
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

  # TESTES INTEGRADOS (Docker Compose)
  test-e2e:
    name: Teste E2E (Docker Compose)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Subir Ambiente de teste
        run: docker compose up -d --build

      - name: Validar Comunicação e Status
        run: |
          sleep 10
          docker compose ps
          # docker compose exec -T frontend ping -c 1 backend || true

  # DOCKER — Build & Push
  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [test-e2e, quality]
    # Liberado para main e dev
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Definir Tag da Imagem
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=dev" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USER }}/mind-backend:${{ steps.vars.outputs.tag }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USER }}/mind-frontend:${{ steps.vars.outputs.tag }}

  # DEPLOY — só na main
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via Docker Compose
        run: |
          echo "Simulando deploy para a produção (Sempre via tag :latest)"
          echo "ssh user@ip 'docker-compose pull && docker-compose up -d'"